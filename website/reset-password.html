<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set a new password — Honco Chat</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        (function () { try { var t = localStorage.getItem('honco-theme'); if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); } } catch (e) {} })();
    </script>
</head>
<body>
<header class="nav" id="top">
    <div class="wrap nav-inner">
        <a class="brand" href="/" aria-label="Honco Chat — home">
            <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6"/><path d="M7 6.5h2.6v4.4h4.8V6.5H17v11h-2.6v-4.3H9.6v4.3H7z"/></svg></span>
            <span class="brand-name">HONCO<span class="brand-sub"> Chat</span></span>
        </a>
        <div class="nav-actions">
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5v2m0 16v2M4.2 4.2l1.4 1.4m12.8 12.8l1.4 1.4M2 12h2m16 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            </button>
        </div>
    </div>
</header>

<main class="auth-wrap">
    <div class="auth-card card">
        <h1>Set a new password</h1>
        <p class="auth-sub">Choose a new password for your Honco Chat account.</p>
        <form id="auth-form" novalidate>
            <label class="auth-field"><span>New password</span>
                <input name="password" type="password" autocomplete="new-password" required minlength="8" autofocus>
            </label>
            <button class="btn btn-primary btn-lg" type="submit">Set new password</button>
        </form>
        <p id="auth-msg" class="auth-msg" hidden></p>
        <p class="auth-links">
            <a href="/login">Back to sign in</a>
        </p>
    </div>
</main>

<script type="module">
    import '/src/styles.css';
    import '/src/auth.css';
    import {initPage} from '/src/auth.js';
    initPage('reset');
</script>
</body>
</html>
